name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Clone WeebHub main repo to build AAR
        run: |
          git clone https://github.com/BiniFn/WeebHub.git /tmp/weebhub-main
          cd /tmp/weebhub-main
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          gomobile bind -ldflags "-checklinkname=0" -target=android -androidapi 21 -o /tmp/seanime.aar ./mobile/
      - name: Copy AAR to native-artifacts
        run: |
          mkdir -p native-artifacts/android
          cp /tmp/seanime.aar native-artifacts/android/
      - name: Set package name
        run: echo "EXPO_ANDROID_PACKAGE=app.weebhub.mobileserver" >> $GITHUB_ENV
      - name: Install dependencies
        run: npm install
      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean
          mkdir -p android/app/libs
          cp /tmp/seanime.aar android/app/libs/seanime.aar
      - name: Build Release APK
        run: |
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../weebhub-mobile-server-v5.0.0.apk
          cp app/build/outputs/apk/release/app-release.apk ../app-release.apk
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            weebhub-mobile-server-v5.0.0.apk
            app-release.apk
          fail_on_unmatched_files: true